# Long-lived caching for static assets.
#
# Every asset URL carries a ?v=<version> query (BLOG.version in the engine), so
# publishing a release changes the URL and busts the cache by itself. The same
# URL can therefore be cached forever.
#
# Included into the nginx server block by /etc/nginx/start.sh.

# Everything not matched below (HTML, directory indexes, redirects) has no
# version in its URL, so it must always be revalidated.
# nginx replaces inherited add_header directives as soon as a location declares
# its own, so the asset location below overrides this one.
add_header Cache-Control "no-cache";

location ~* \.(?:css|js|mjs|webp|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|pdf|zip|7z|kml|jmx)$ {
    # A regex location inherits `root` from the server context, not from the
    # `location /` block that default.conf defines, so it has to be repeated
    # here. Keep in sync with the COPY target in the Dockerfile.
    root /usr/share/nginx/html;

    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
