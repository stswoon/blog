# Compression for text assets.
#
# Images (png/webp/jpeg) and fonts (woff2) are already compressed containers, so
# they are deliberately absent from gzip_types: re-compressing them only burns
# CPU for a few saved bytes.
#
# Included into the nginx server block by /etc/nginx/start.sh.

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/css
    text/plain
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;
