  <text x="1172" y="523" class="body" text-anchor="middle" style="fill:#b9e8e6">10 / 10</text>
  <rect x="1312" y="390" width="224" height="165" rx="22" fill="#463c52" stroke="#977c8e" stroke-width="1.5"/>
  <circle cx="1424" cy="426" r="20" fill="none" stroke="#ffc1b1" stroke-width="2.5"/>
  <path d="M1424 413v13l9 5" fill="none" stroke="#ffc1b1" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1424" y="481" class="heading" text-anchor="middle">Время</text>
  <text x="1424" y="523" class="heading" text-anchor="middle">вышло</text>
  <text x="1298" y="593" class="small" text-anchor="middle">один из двух исходов</text>
  <path d="M1172 555v12h-82v56h416v-56h-82v-12m-126 68v23" fill="none" stroke="#819bb5" stroke-width="2.5"/>
  <rect x="1116" y="655" width="364" height="76" rx="22" fill="#91e4eb"/>
  <path d="M1170 703a16 16 0 1 1 7-23m-12-1h13v-13" fill="none" stroke="#23465a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1200" y="704" class="heading" style="fill:#23465a">Перезапуск</text>
  <path d="M1116 693h-72q-18 0-18-18v-33q0-18-18-18h-17" fill="none" stroke="#77dfe9" stroke-width="3" marker-end="url(#game-arrow)"/>
  <text x="1298" y="779" text-anchor="middle" class="body" style="fill:#a8dce6">Новая попытка</text>

  <g fill="#243d58" stroke="#5d7c99" stroke-width="1.4">
    <rect x="64" y="829" width="48" height="46" rx="10"/>
    <rect x="120" y="829" width="48" height="46" rx="10"/>
    <rect x="176" y="829" width="48" height="46" rx="10"/>
    <rect x="232" y="829" width="48" height="46" rx="10"/>
  </g>
  <g fill="none" stroke="#b9d5e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M99 852H77m8-8-8 8 8 8M144 863v-22m-8 8 8-8 8 8M200 841v22m-8-8 8 8 8-8M245 852h22m-8-8 8 8-8 8"/>
  </g>
  <text x="308" y="861" style="font-size:29px;fill:#dceaf7">Проверяем не кадры, а поведение игры.</text>
</svg>
