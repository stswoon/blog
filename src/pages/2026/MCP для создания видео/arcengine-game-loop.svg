<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="game-title game-desc">
  <title id="game-title">ArcEngine: концепт браузерного прототипа и игровой цикл</title>
  <desc id="game-desc">Не скриншот и не видео: оригинальная схема интерактивного прототипа. В изометрическом мире персонаж собирает кристаллы. Цель — собрать десять кристаллов за шестьдесят секунд. В примере уже собрано три, на острове осталось семь. Возможны два исхода: победа или время вышло. Кнопка Перезапуск возвращает к игре. Проверка включает управление, сбор, оба исхода и повторный запуск, а не только просмотр кадров MP4.</desc>
  <defs>
    <linearGradient id="game-bg" x2="1" y2="1">
      <stop stop-color="#08162f"/>
      <stop offset="1" stop-color="#152d4b"/>
    </linearGradient>
    <linearGradient id="game-sky" x2="0" y2="1">
      <stop stop-color="#10243f"/>
      <stop offset="1" stop-color="#17364e"/>
    </linearGradient>
    <linearGradient id="game-ground" x2="1" y2="1">
      <stop stop-color="#285c73"/>
      <stop offset="1" stop-color="#1a3f5b"/>
    </linearGradient>
    <radialGradient id="game-glow">
      <stop stop-color="#65dfed" stop-opacity=".22"/>
      <stop offset="1" stop-color="#65dfed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="game-crystal" x2="1" y2="1">
      <stop stop-color="#b1f8fa"/>
      <stop offset=".5" stop-color="#69d9ed"/>
      <stop offset="1" stop-color="#a499ec"/>
    </linearGradient>
    <marker id="game-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="m2 2 8 4-8 4" fill="none" stroke="#77dfe9" stroke-width="2" stroke-linejoin="round"/>
    </marker>
    <g id="game-gem">
      <ellipse cy="20" rx="28" ry="12" fill="#08182b" opacity=".35"/>
      <ellipse cy="19" rx="19" ry="7" fill="#77e6ef" opacity=".22"/>
      <path d="M0-43 20-19 14 9 0 22-14 9-20-19Z" fill="url(#game-crystal)"/>
      <path d="M0-43v65L-14 9-20-19Z" fill="#54aecb"/>
      <path d="m0-43 20 24L0-10-20-19Z" fill="#b8f5f9"/>
      <path d="M0-10v32M0-43l20 24" fill="none" stroke="#d9fbff" stroke-width="1.4"/>
    </g>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #edf5ff; }
      .kicker { font-size: 25px; font-weight: 600; letter-spacing: 2px; fill: #7ee7f0; }
      .title { font-size: 52px; font-weight: 700; letter-spacing: -.8px; }
      .subtitle { font-size: 28px; fill: #b9cce3; }
      .heading { font-size: 30px; font-weight: 650; }
      .body { font-size: 27px; fill: #d4e2f2; }
      .small { font-size: 25px; fill: #b9cce3; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#game-bg)"/>
  <ellipse cx="550" cy="550" rx="630" ry="370" fill="url(#game-glow)"/>
  <text x="64" y="69" class="kicker">ARCENGINE · КОНЦЕПТ ПРОТОТИПА</text>
  <text x="64" y="133" class="title">Не ролик, а игровой цикл</text>
  <text x="64" y="180" class="subtitle">Результат проверяют движением, сбором и повторным запуском.</text>
  <rect x="1200" y="42" width="336" height="48" rx="24" fill="#263b57" stroke="#637690" stroke-width="1.3"/>
  <text x="1368" y="74" text-anchor="middle" style="font-size:25px;fill:#d8e5f3">БРАУЗЕР · НЕ MP4</text>

  <!-- An invented browser scene, not a captured application interface. -->
  <rect x="64" y="236" width="942" height="562" rx="26" fill="url(#game-sky)" stroke="#47647e" stroke-width="1.5"/>
  <path d="M65 290h940" stroke="#3d5a74" stroke-width="1.5"/>
  <circle cx="91" cy="264" r="6" fill="#eea79d"/>
  <circle cx="113" cy="264" r="6" fill="#bca9ed"/>
  <circle cx="135" cy="264" r="6" fill="#74d8e5"/>
  <text x="171" y="274" class="body">Игровой прототип</text>
  <path d="M950 258h17m-17 12h17" stroke="#6f8ba7" stroke-width="3" stroke-linecap="round"/>

  <rect x="94" y="309" width="385" height="83" rx="17" fill="#25465e" stroke="#52788c" stroke-width="1.3"/>
  <text x="115" y="344" class="body" style="font-weight:600;fill:#e5f4fa">Собрать 10 кристаллов</text>
  <text x="115" y="377" class="small">Сейчас: 3 / 10</text>
  <rect x="736" y="309" width="240" height="83" rx="17" fill="#3e3d5b" stroke="#837197" stroke-width="1.3"/>
  <circle cx="764" cy="338" r="11" fill="none" stroke="#d9c9fb" stroke-width="2"/>
  <path d="M764 331v7l5 3" fill="none" stroke="#d9c9fb" stroke-width="2" stroke-linecap="round"/>
  <text x="788" y="347" class="body" style="fill:#f0e8ff">60 секунд</text>
  <text x="757" y="377" class="small">Осталось: 42 с</text>

  <!-- The island has depth, an isometric grid and seven remaining crystals. -->
  <ellipse cx="552" cy="694" rx="344" ry="55" fill="#081b30" opacity=".5"/>
  <path d="m172 552 380 161v30L172 582Z" fill="#15334f" stroke="#355371" stroke-width="1.3"/>
  <path d="m552 713 380-161v30L552 743Z" fill="#102a44" stroke="#355371" stroke-width="1.3"/>
  <path d="m172 552 380-147 380 147-380 161Z" fill="url(#game-ground)" stroke="#5d8ba3" stroke-width="2"/>
  <g fill="none" stroke="#5b8ba0" stroke-width="1.2" opacity=".35">
    <path d="m248 523 380 158m-304-187 380 155m-304-185 380 152m-304-182 380 150"/>
    <path d="M248 584 628 434M324 616l380-153M400 649l380-155M476 681l380-158"/>
  </g>
  <path d="m480 577 72-30 75 29-75 32Z" fill="#77c5d2" opacity=".12" stroke="#86d5dd" stroke-width="1.5"/>
  <path d="M578 570q61 14 108-26l30-25" fill="none" stroke="#ffbaab" stroke-width="3" stroke-dasharray="6 8" stroke-linecap="round"/>
  <ellipse cx="716" cy="527" rx="39" ry="16" fill="none" stroke="#ffbaab" stroke-width="2" stroke-dasharray="5 5"/>

  <use href="#game-gem" transform="translate(399 477) scale(.88)"/>
  <use href="#game-gem" transform="translate(559 449) scale(.84)"/>
  <use href="#game-gem" transform="translate(716 508)"/>
  <use href="#game-gem" transform="translate(790 569) scale(.93)"/>
  <use href="#game-gem" transform="translate(302 550) scale(.96)"/>

  <!-- A small original character in a coral jacket. -->
  <g transform="translate(552 549)">
    <ellipse cy="37" rx="35" ry="14" fill="#092034" opacity=".5"/>
    <path d="m-20-1 1 35 13 5 7-30 6 31 14-5-1-37Z" fill="#6e73aa"/>
    <path d="m-19 27-5 10 15 6 7-11m7 0 5 11 17-7-8-9" fill="#d0c9f1"/>
    <path d="m-24-35 25-13 28 14-7 39L0 17-27 3Z" fill="#efa197"/>
    <path d="M1-48 29-34 22 5 0 17Z" fill="#cc7c86"/>
    <path d="m-22-28-19 15 5 24 12-4 1-15m49-20 11 18-7 17-10-5" fill="#f4b2a2" stroke="#dc9290" stroke-width="1.2"/>
    <path d="m-11-42 11 14 12-14" fill="none" stroke="#ffd3ba" stroke-width="3"/>
    <circle cx="1" cy="-61" r="22" fill="#ded9fa"/>
    <path d="M-20-62q1-26 23-24 25 2 20 30l-11-10-30 8Z" fill="#b9aae6"/>
    <rect x="0" y="-66" width="22" height="10" rx="5" fill="#334363"/>
    <circle cx="15" cy="-61" r="2.5" fill="#9cf0f1"/>
  </g>
  <use href="#game-gem" transform="translate(428 606) scale(1.04)"/>
  <use href="#game-gem" transform="translate(634 630) scale(1.06)"/>

  <g fill="#2e526a" stroke="#61849b" stroke-width="1.1">
    <path d="m218 562 19-8 18 8v12l-18 8-19-8Z"/>
    <path d="m841 542 19-8 18 8v12l-18 8-19-8Z"/>
    <path d="m506 675 19-8 18 8v12l-18 8-19-8Z"/>
  </g>
  <g stroke="#85cad4" stroke-width="2" stroke-linecap="round">
    <path d="M347 523v12m-6-6h12M667 469v10m-5-5h10"/>
  </g>
  <text x="94" y="774" class="small">Движение → сбор → изменение состояния</text>

  <!-- Two alternative outcomes merge into a genuine restart loop. -->
  <rect x="1060" y="236" width="476" height="104" rx="22" fill="#dce6fa"/>
  <text x="1090" y="280" class="heading" style="fill:#263a58">Условия игры</text>
  <text x="1090" y="319" class="body" style="fill:#3b5272">10 кристаллов · 60 секунд</text>
  <path d="M1298 340v25m-126 18v-18h252v18" fill="none" stroke="#819bb5" stroke-width="2.5"/>
  <circle cx="1298" cy="365" r="4" fill="#b8cde3"/>
  <rect x="1060" y="390" width="224" height="165" rx="22" fill="#214a55" stroke="#63969c" stroke-width="1.5"/>
  <circle cx="1172" cy="426" r="20" fill="#9ae2df"/>
  <path d="m1162 426 7 7 13-15" fill="none" stroke="#28545c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
